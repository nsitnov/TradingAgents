<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TradingAgents Dashboard</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --ink: #17202a;
        --muted: #687385;
        --line: #d9dee7;
        --blue: #2563eb;
        --green: #0f8a5f;
        --red: #c2413a;
        --amber: #b7791f;
        --shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        background: #fff;
        position: sticky;
        top: 0;
        z-index: 4;
      }

      h1 { font-size: 18px; margin: 0; font-weight: 700; }
      h2 { font-size: 14px; margin: 0 0 10px; color: #293241; }
      button, input, select, textarea {
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
      }
      input, select, textarea { min-height: 34px; padding: 6px 8px; width: 100%; }
      button {
        min-height: 34px;
        padding: 7px 12px;
        cursor: pointer;
        font-weight: 600;
      }
      button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
      button.danger { color: var(--red); }
      button:disabled { opacity: 0.55; cursor: not-allowed; }

      main {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        gap: 14px;
        padding: 14px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: 14px;
        min-width: 0;
      }

      .sidebar { display: grid; gap: 14px; align-content: start; }
      .content { display: grid; gap: 14px; min-width: 0; }
      .wide-main { grid-template-columns: 1fr; }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .field { display: grid; gap: 5px; margin-bottom: 10px; }
      .field label { font-size: 12px; color: var(--muted); font-weight: 650; }
      .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .checks label { display: flex; gap: 7px; align-items: center; font-size: 13px; }
      .checks input { width: auto; min-height: auto; }
      .actions { display: flex; gap: 8px; }
      .metric {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 9px;
        min-height: 62px;
        background: #fbfcfe;
      }
      .metric span { display: block; color: var(--muted); font-size: 12px; }
      .metric strong { display: block; font-size: 18px; margin-top: 4px; }
      .status-pill {
        display: inline-flex;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        background: #edf2ff;
        color: #2448b8;
      }
      .status-completed { background: #e8f7ef; color: var(--green); }
      .status-error, .status-cancelled { background: #fdeceb; color: var(--red); }
      .agent-list { display: grid; gap: 6px; }
      .agent {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border-bottom: 1px solid #eef1f5;
        padding: 6px 0;
        font-size: 13px;
      }
      .feed {
        height: 360px;
        overflow: auto;
        display: grid;
        align-content: start;
        gap: 8px;
      }
      .event {
        border-left: 3px solid var(--blue);
        padding: 7px 9px;
        background: #fbfcfe;
        border-radius: 4px;
        overflow-wrap: anywhere;
      }
      .event small { color: var(--muted); display: block; margin-bottom: 3px; }
      .reports {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .report {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
        min-height: 150px;
        max-height: 320px;
        overflow: auto;
        background: #fbfcfe;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { border-bottom: 1px solid #eef1f5; padding: 7px 6px; text-align: left; }
      th { color: var(--muted); font-weight: 700; }
      .pos { color: var(--green); }
      .neg { color: var(--red); }
      .muted { color: var(--muted); }
      .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
      .tab {
        min-height: 30px;
        padding: 5px 10px;
        border-color: transparent;
        background: transparent;
        color: var(--muted);
      }
      .tab.active { background: #edf2ff; color: var(--blue); border-color: #c8d7ff; }
      .chart {
        display: grid;
        grid-auto-flow: column;
        align-items: end;
        gap: 3px;
        height: 180px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px;
        background: #fbfcfe;
        overflow: hidden;
      }
      .bar {
        min-width: 8px;
        background: var(--blue);
        border-radius: 3px 3px 0 0;
      }
      .scroll-table { max-height: 420px; overflow: auto; }
      .toolbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

      @media (max-width: 980px) {
        main { grid-template-columns: 1fr; }
        .grid-2, .reports { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useEffect, useMemo, useRef, useState } = React;

      const money = (value) => Number(value || 0).toLocaleString(undefined, {
        style: "currency",
        currency: "USD",
        maximumFractionDigits: 2
      });
      const number = (value) => Number(value || 0).toLocaleString(undefined, {
        maximumFractionDigits: 4
      });
      const statusClass = (status) => `status-pill status-${status || "queued"}`;

      function App() {
        const today = new Date().toISOString().slice(0, 10);
        const defaultBacktestStart = new Date(Date.now() - 90 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
        const [tab, setTab] = useState("progress");
        const [form, setForm] = useState({
          ticker: "SPY",
          analysis_date: today,
          analysts: ["market", "social", "news", "fundamentals"],
          research_depth: 1,
          llm_provider: "openai",
          shallow_thinker: "gpt-5.4-mini",
          deep_thinker: "gpt-5.4",
          output_language: "English"
        });
        const [run, setRun] = useState(null);
        const [runs, setRuns] = useState([]);
        const [portfolio, setPortfolio] = useState(null);
        const [portfolioHistory, setPortfolioHistory] = useState(null);
        const [automationConfig, setAutomationConfig] = useState(null);
        const [automationHistory, setAutomationHistory] = useState([]);
        const [autopilotConfig, setAutopilotConfig] = useState(null);
        const [autopilotStatus, setAutopilotStatus] = useState(null);
        const [autopilotJobs, setAutopilotJobs] = useState([]);
        const [autopilotLoading, setAutopilotLoading] = useState(false);
        const [autopilotError, setAutopilotError] = useState("");
        const [openaiCosts, setOpenaiCosts] = useState(null);
        const [readinessMetrics, setReadinessMetrics] = useState(null);
        const [stabilityGate, setStabilityGate] = useState(null);
        const [postmortems, setPostmortems] = useState({ summary: {}, postmortems: [] });
        const [progressWeekly, setProgressWeekly] = useState(null);
        const [progressHistory, setProgressHistory] = useState([]);
        const [backtestForm, setBacktestForm] = useState({
          tickers: "SPY",
          start: defaultBacktestStart,
          end: today,
          initial_cash: 100000,
          fixed_decision: "Hold",
          spread_bps: 5,
          slippage_bps: 5,
          fee_bps: 0,
          fixed_fee: 0
        });
        const [backtests, setBacktests] = useState([]);
        const [selectedBacktest, setSelectedBacktest] = useState(null);
        const [backtestLoading, setBacktestLoading] = useState(false);
        const [backtestError, setBacktestError] = useState("");
        const [agentReplayForm, setAgentReplayForm] = useState({
          tickers: "SPY",
          start: defaultBacktestStart,
          end: today,
          max_decisions: 25,
          decision_provider: "tradingagents",
          fixed_decision: "Hold",
          research_depth: 1,
          llm_provider: "openai",
          shallow_thinker: "gpt-5.4-mini",
          deep_thinker: "gpt-5.4"
        });
        const [agentReplayJobs, setAgentReplayJobs] = useState([]);
        const [selectedAgentReplay, setSelectedAgentReplay] = useState(null);
        const [agentReplayLoading, setAgentReplayLoading] = useState(false);
        const [agentReplayError, setAgentReplayError] = useState("");
        const [scannerForm, setScannerForm] = useState({
          title: "TSMC raises guidance after strong AI chip demand",
          summary: "Taiwan Semiconductor reports record growth in advanced chip demand.",
          source: "manual",
          region: "ASIA",
          url: "",
          lookback_days: 60,
          z_threshold: 1.5,
          min_abs_gap_pct: 0.005,
          min_total_score: 0.65
        });
        const [scannerSignals, setScannerSignals] = useState([]);
        const [scannerEvents, setScannerEvents] = useState([]);
        const [scannerDislocations, setScannerDislocations] = useState([]);
        const [scannerConfluenceReviews, setScannerConfluenceReviews] = useState([]);
        const [scannerCalibration, setScannerCalibration] = useState(null);
        const [scannerLoading, setScannerLoading] = useState(false);
        const [scannerError, setScannerError] = useState("");
        const [error, setError] = useState("");
        const sourceRef = useRef(null);

        useEffect(() => {
          refreshRuns();
          refreshPortfolio();
          refreshPortfolioHistory();
          refreshAutomation();
          refreshAutopilot();
          refreshCosts();
          refreshReadiness();
          refreshProgress();
          refreshBacktests();
          refreshAgentReplays();
          refreshScanner();
          return () => sourceRef.current?.close();
        }, []);

        const active = run && !["completed", "error", "cancelled"].includes(run.status);

        async function refreshRuns() {
          const res = await fetch("/api/runs");
          const data = await res.json();
          setRuns(data.runs || []);
        }

        async function refreshPortfolio() {
          const res = await fetch("/api/portfolio");
          setPortfolio(await res.json());
        }

        async function refreshPortfolioHistory() {
          const res = await fetch("/api/portfolio/history");
          setPortfolioHistory(await res.json());
        }

        async function refreshAutomation() {
          const [configRes, historyRes] = await Promise.all([
            fetch("/api/automation/config"),
            fetch("/api/automation/history")
          ]);
          if (configRes.ok) setAutomationConfig(await configRes.json());
          if (historyRes.ok) setAutomationHistory((await historyRes.json()).jobs || []);
        }

        async function refreshAutopilot() {
          const [configRes, statusRes, jobsRes] = await Promise.all([
            fetch("/api/autopilot/config"),
            fetch("/api/autopilot/status"),
            fetch("/api/autopilot/jobs")
          ]);
          if (configRes.ok) setAutopilotConfig(await configRes.json());
          if (statusRes.ok) setAutopilotStatus(await statusRes.json());
          if (jobsRes.ok) setAutopilotJobs((await jobsRes.json()).jobs || []);
        }

        async function saveAutopilotConfig(nextConfig) {
          setAutopilotError("");
          const res = await fetch("/api/autopilot/config", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(nextConfig)
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) {
            setAutopilotError(body.detail || "Could not save autopilot config");
            return;
          }
          setAutopilotConfig(body);
          refreshAutopilot();
        }

        async function runAutopilotNow() {
          setAutopilotError("");
          setAutopilotLoading(true);
          try {
            const res = await fetch("/api/autopilot/run-now", { method: "POST" });
            const body = await res.json().catch(() => ({}));
            if (!res.ok) {
              setAutopilotError(body.detail || "Could not run autopilot");
              return;
            }
            refreshAutopilot();
            refreshScanner();
            refreshPortfolio();
            refreshReadiness();
            refreshProgress();
          } finally {
            setAutopilotLoading(false);
          }
        }

        async function refreshCosts() {
          const res = await fetch("/api/costs/openai");
          if (res.ok) setOpenaiCosts(await res.json());
        }

        async function refreshReadiness() {
          const [metricsRes, gateRes, postmortemsRes] = await Promise.all([
            fetch("/api/readiness/metrics"),
            fetch("/api/readiness/stability-gate"),
            fetch("/api/readiness/postmortems")
          ]);
          if (metricsRes.ok) setReadinessMetrics(await metricsRes.json());
          if (gateRes.ok) setStabilityGate(await gateRes.json());
          if (postmortemsRes.ok) setPostmortems(await postmortemsRes.json());
        }

        async function refreshProgress() {
          const [weeklyRes, historyRes] = await Promise.all([
            fetch("/api/progress/weekly"),
            fetch("/api/progress/history")
          ]);
          if (weeklyRes.ok) setProgressWeekly(await weeklyRes.json());
          if (historyRes.ok) setProgressHistory((await historyRes.json()).weeks || []);
        }

        async function refreshBacktests() {
          const res = await fetch("/api/backtests");
          if (res.ok) setBacktests((await res.json()).backtests || []);
        }

        async function runBacktest(event) {
          event.preventDefault();
          setBacktestError("");
          setBacktestLoading(true);
          const payload = {
            tickers: backtestForm.tickers.split(",").map((item) => item.trim()).filter(Boolean),
            start: backtestForm.start,
            end: backtestForm.end,
            initial_cash: Number(backtestForm.initial_cash || 100000),
            decision_provider: "fixed",
            fixed_decision: backtestForm.fixed_decision,
            transaction_costs: {
              spread_bps: Number(backtestForm.spread_bps || 0),
              slippage_bps: Number(backtestForm.slippage_bps || 0),
              fee_bps: Number(backtestForm.fee_bps || 0),
              fixed_fee: Number(backtestForm.fixed_fee || 0)
            }
          };
          try {
            const res = await fetch("/api/backtests", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });
            const body = await res.json().catch(() => ({}));
            if (!res.ok) {
              setBacktestError(body.detail || "Could not run backtest");
              return;
            }
            setSelectedBacktest({ result: body });
            refreshBacktests();
            refreshProgress();
          } finally {
            setBacktestLoading(false);
          }
        }

        async function openBacktest(backtestId) {
          const res = await fetch(`/api/backtests/${backtestId}`);
          if (res.ok) setSelectedBacktest(await res.json());
        }

        async function refreshAgentReplays() {
          const res = await fetch("/api/agent-replays");
          if (res.ok) setAgentReplayJobs((await res.json()).jobs || []);
        }

        async function startAgentReplay(event) {
          event.preventDefault();
          setAgentReplayError("");
          setAgentReplayLoading(true);
          const payload = {
            tickers: agentReplayForm.tickers.split(",").map((item) => item.trim()).filter(Boolean),
            start: agentReplayForm.start,
            end: agentReplayForm.end,
            max_decisions: Number(agentReplayForm.max_decisions || 25),
            decision_provider: agentReplayForm.decision_provider,
            fixed_decision: agentReplayForm.fixed_decision,
            research_depth: Number(agentReplayForm.research_depth || 1),
            llm_provider: agentReplayForm.llm_provider,
            shallow_thinker: agentReplayForm.shallow_thinker,
            deep_thinker: agentReplayForm.deep_thinker
          };
          try {
            const res = await fetch("/api/agent-replays", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });
            const body = await res.json().catch(() => ({}));
            if (!res.ok) {
              setAgentReplayError(body.detail || "Could not start agent replay");
              return;
            }
            setSelectedAgentReplay(body);
            refreshAgentReplays();
            refreshProgress();
          } finally {
            setAgentReplayLoading(false);
          }
        }

        async function openAgentReplay(jobId) {
          const res = await fetch(`/api/agent-replays/${jobId}`);
          if (res.ok) setSelectedAgentReplay(await res.json());
        }

        async function cancelAgentReplay(jobId) {
          await fetch(`/api/agent-replays/${jobId}/cancel`, { method: "POST" });
          refreshAgentReplays();
          openAgentReplay(jobId);
        }

        async function refreshScanner() {
          const [signalsRes, eventsRes, dislocationsRes, confluenceRes, calibrationRes] = await Promise.all([
            fetch("/api/scanner/signals"),
            fetch("/api/scanner/events"),
            fetch("/api/scanner/dislocations"),
            fetch("/api/scanner/confluence/reviews"),
            fetch("/api/scanner/calibration")
          ]);
          if (signalsRes.ok) setScannerSignals((await signalsRes.json()).signals || []);
          if (eventsRes.ok) setScannerEvents((await eventsRes.json()).events || []);
          if (dislocationsRes.ok) setScannerDislocations((await dislocationsRes.json()).dislocations || []);
          if (confluenceRes.ok) setScannerConfluenceReviews((await confluenceRes.json()).reviews || []);
          if (calibrationRes.ok) setScannerCalibration(await calibrationRes.json());
        }

        async function ingestScannerEvent(event) {
          event.preventDefault();
          setScannerError("");
          setScannerLoading(true);
          try {
            const res = await fetch("/api/scanner/events", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(scannerForm)
            });
            const body = await res.json().catch(() => ({}));
            if (!res.ok) {
              setScannerError(body.detail || "Could not ingest scanner event");
              return;
            }
            refreshScanner();
          } finally {
            setScannerLoading(false);
          }
        }

        async function detectScannerDislocations() {
          setScannerError("");
          setScannerLoading(true);
          try {
            const res = await fetch("/api/scanner/dislocations/detect", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                lookback_days: Number(scannerForm.lookback_days || 60),
                z_threshold: Number(scannerForm.z_threshold || 1.5),
                min_abs_gap_pct: Number(scannerForm.min_abs_gap_pct || 0.005)
              })
            });
            const body = await res.json().catch(() => ({}));
            if (!res.ok) {
              setScannerError(body.detail || "Could not detect dislocations");
              return;
            }
            refreshScanner();
          } finally {
            setScannerLoading(false);
          }
        }

        async function reviewScannerConfluence() {
          setScannerError("");
          setScannerLoading(true);
          try {
            const res = await fetch("/api/scanner/confluence/review", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                min_z_score: Number(scannerForm.z_threshold || 1.5),
                min_abs_gap_pct: Number(scannerForm.min_abs_gap_pct || 0.005),
                min_total_score: Number(scannerForm.min_total_score || 0.65)
              })
            });
            const body = await res.json().catch(() => ({}));
            if (!res.ok) {
              setScannerError(body.detail || "Could not review confluence");
              return;
            }
            refreshScanner();
          } finally {
            setScannerLoading(false);
          }
        }

        async function executeScannerConfluence() {
          setScannerError("");
          setScannerLoading(true);
          try {
            const res = await fetch("/api/scanner/confluence/execute", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({})
            });
            const body = await res.json().catch(() => ({}));
            if (!res.ok) {
              setScannerError(body.detail || "Could not execute scanner candidates");
              return;
            }
            refreshScanner();
            refreshPortfolio();
            refreshProgress();
          } finally {
            setScannerLoading(false);
          }
        }

        async function startRun(event) {
          event.preventDefault();
          setError("");
          sourceRef.current?.close();
          const res = await fetch("/api/runs", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(form)
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            setError(body.detail || "Could not start run");
            return;
          }
          const next = await res.json();
          setRun(next);
          attachEvents(next.run_id);
          refreshRuns();
        }

        async function cancelRun() {
          if (!run) return;
          await fetch(`/api/runs/${run.run_id}/cancel`, { method: "POST" });
        }

        function attachEvents(runId) {
          const source = new EventSource(`/api/runs/${runId}/events`);
          sourceRef.current = source;
          source.onmessage = () => {};
          [
            "run_started", "message", "tool_call", "agent_status", "report_section",
            "stats", "decision", "position_update", "pnl_update", "run_completed", "run_error"
          ].forEach((type) => {
            source.addEventListener(type, async (event) => {
              const res = await fetch(`/api/runs/${runId}`);
              if (res.ok) setRun(await res.json());
              if (["position_update", "pnl_update", "run_completed"].includes(type)) {
                refreshPortfolio();
                refreshPortfolioHistory();
                refreshRuns();
              }
              if (["run_completed", "run_error"].includes(type)) source.close();
            });
          });
        }

        function toggleAnalyst(name) {
          const exists = form.analysts.includes(name);
          const analysts = exists
            ? form.analysts.filter((item) => item !== name)
            : [...form.analysts, name];
          setForm({ ...form, analysts });
        }

        return (
          <>
            <header>
              <h1>TradingAgents Live Dashboard</h1>
              <div className="tabs">
                {[
                  ["progress", "Progress"],
                  ["autopilot", "Autopilot"],
                  ["live", "Live Runs"],
                  ["portfolio", "Paper Portfolio"],
                  ["backtests", "Backtest Lab"],
                  ["agentReplay", "Replay Lab"],
                  ["scanner", "Scanner Lab"],
                  ["automation", "Automation"],
                  ["readiness", "Readiness"],
                  ["history", "Analysis History"],
                  ["costs", "OpenAI Spend"]
                ].map(([key, label]) => (
                  <button key={key} className={`tab ${tab === key ? "active" : ""}`} onClick={() => setTab(key)}>{label}</button>
                ))}
                <span className={statusClass(run?.status)}>{run?.status || "idle"}</span>
              </div>
            </header>
            {tab === "progress" && <ProgressDashboard weekly={progressWeekly} history={progressHistory} refresh={refreshProgress} />}
            {tab === "autopilot" && <AutopilotDashboard config={autopilotConfig} status={autopilotStatus} jobs={autopilotJobs} loading={autopilotLoading} error={autopilotError} saveConfig={saveAutopilotConfig} runNow={runAutopilotNow} refresh={refreshAutopilot} scannerCalibration={scannerCalibration} readiness={stabilityGate} />}
            {tab === "live" && (
              <main>
                <aside className="sidebar">
                  <RunLauncher form={form} setForm={setForm} today={today} active={active} error={error} startRun={startRun} cancelRun={cancelRun} toggleAnalyst={toggleAnalyst} />
                  <Portfolio portfolio={portfolio} />
                  <RecentRuns runs={runs} />
                </aside>
                <section className="content">
                  <RunMetrics run={run} portfolio={portfolio} />
                  <div className="grid-2">
                    <AgentStatus run={run} />
                    <LiveFeed run={run} />
                  </div>
                  <Reports run={run} />
                </section>
              </main>
            )}
            {tab === "portfolio" && <PortfolioDashboard portfolio={portfolio} data={portfolioHistory} />}
            {tab === "backtests" && <BacktestsDashboard form={backtestForm} setForm={setBacktestForm} backtests={backtests} selected={selectedBacktest} loading={backtestLoading} error={backtestError} runBacktest={runBacktest} openBacktest={openBacktest} />}
            {tab === "agentReplay" && <AgentReplayDashboard form={agentReplayForm} setForm={setAgentReplayForm} jobs={agentReplayJobs} selected={selectedAgentReplay} loading={agentReplayLoading} error={agentReplayError} startReplay={startAgentReplay} openReplay={openAgentReplay} cancelReplay={cancelAgentReplay} refresh={refreshAgentReplays} />}
            {tab === "scanner" && <ScannerDashboard form={scannerForm} setForm={setScannerForm} signals={scannerSignals} events={scannerEvents} dislocations={scannerDislocations} confluenceReviews={scannerConfluenceReviews} calibration={scannerCalibration} loading={scannerLoading} error={scannerError} ingestEvent={ingestScannerEvent} detectDislocations={detectScannerDislocations} reviewConfluence={reviewScannerConfluence} executeConfluence={executeScannerConfluence} refresh={refreshScanner} />}
            {tab === "automation" && <AutomationDashboard config={automationConfig} history={automationHistory} refresh={refreshAutomation} />}
            {tab === "readiness" && <ReadinessDashboard metrics={readinessMetrics} gate={stabilityGate} postmortems={postmortems} refresh={refreshReadiness} />}
            {tab === "history" && <AnalysisHistory runs={runs} />}
            {tab === "costs" && <CostsDashboard data={openaiCosts} refresh={refreshCosts} />}
          </>
        );
      }

      function RunLauncher({ form, setForm, today, active, error, startRun, cancelRun, toggleAnalyst }) {
        return (
          <section className="panel">
            <h2>New Run</h2>
            <form onSubmit={startRun}>
              <div className="grid-2">
                <div className="field"><label>Ticker</label><input value={form.ticker} onChange={(e) => setForm({ ...form, ticker: e.target.value.toUpperCase() })} /></div>
                <div className="field"><label>Date</label><input type="date" value={form.analysis_date} max={today} onChange={(e) => setForm({ ...form, analysis_date: e.target.value })} /></div>
              </div>
              <div className="field">
                <label>Analysts</label>
                <div className="checks">
                  {["market", "social", "news", "fundamentals"].map((name) => (
                    <label key={name}><input type="checkbox" checked={form.analysts.includes(name)} onChange={() => toggleAnalyst(name)} />{name}</label>
                  ))}
                </div>
              </div>
              <div className="grid-2">
                <div className="field"><label>Depth</label><select value={form.research_depth} onChange={(e) => setForm({ ...form, research_depth: Number(e.target.value) })}>{[1, 2, 3, 4, 5].map((n) => <option key={n} value={n}>{n}</option>)}</select></div>
                <div className="field"><label>Provider</label><select value={form.llm_provider} onChange={(e) => setForm({ ...form, llm_provider: e.target.value })}>{["openai", "google", "anthropic", "xai", "deepseek", "qwen", "glm", "openrouter", "ollama"].map((p) => <option key={p}>{p}</option>)}</select></div>
              </div>
              <div className="field"><label>Quick model</label><input value={form.shallow_thinker} onChange={(e) => setForm({ ...form, shallow_thinker: e.target.value })} /></div>
              <div className="field"><label>Deep model</label><input value={form.deep_thinker} onChange={(e) => setForm({ ...form, deep_thinker: e.target.value })} /></div>
              <div className="actions">
                <button className="primary" type="submit" disabled={active || form.analysts.length === 0}>Start</button>
                <button className="danger" type="button" disabled={!active} onClick={cancelRun}>Cancel</button>
              </div>
              {error && <p className="neg">{error}</p>}
            </form>
          </section>
        );
      }

      function RecentRuns({ runs }) {
        return (
          <section className="panel">
            <h2>Recent Runs</h2>
            <div className="agent-list">
              {runs.slice(0, 8).map((item) => (
                <div className="agent" key={item.run_id}>
                  <span>{item.request.ticker} <span className="muted">{item.request.analysis_date}</span></span>
                  <span className={statusClass(item.status)}>{item.status}</span>
                </div>
              ))}
            </div>
          </section>
        );
      }

      function RunMetrics({ run, portfolio }) {
        const stats = run?.stats || {};
        return (
          <section className="grid-3">
            <div className="metric"><span>Decision</span><strong>{run?.decision || "--"}</strong></div>
            <div className="metric"><span>LLM / Tool calls</span><strong>{stats.llm_calls || 0} / {stats.tool_calls || 0}</strong></div>
            <div className="metric"><span>Total P&L</span><strong className={(portfolio?.total_pnl || 0) >= 0 ? "pos" : "neg"}>{money(portfolio?.total_pnl)}</strong></div>
          </section>
        );
      }

      function AgentStatus({ run }) {
        const agents = Object.entries(run?.agent_status || {});
        return (
          <section className="panel">
            <h2>Agents</h2>
            <div className="agent-list">
              {agents.length === 0 && <p className="muted">No active run.</p>}
              {agents.map(([name, status]) => (
                <div className="agent" key={name}>
                  <span>{name}</span>
                  <span className={statusClass(status)}>{status}</span>
                </div>
              ))}
            </div>
          </section>
        );
      }

      function LiveFeed({ run }) {
        const items = useMemo(() => {
          const messages = (run?.messages || []).map((item) => ({ ...item, kind: item.type }));
          const tools = (run?.tool_calls || []).map((item) => ({ time: item.time, kind: "Tool", content: `${item.name} ${JSON.stringify(item.args || {})}` }));
          return [...messages, ...tools].slice(-80).reverse();
        }, [run]);
        return (
          <section className="panel">
            <h2>Live Stream</h2>
            <div className="feed">
              {items.length === 0 && <p className="muted">Waiting for events.</p>}
              {items.map((item, index) => (
                <div className="event" key={`${item.time}-${index}`}>
                  <small>{item.time} · {item.kind}</small>
                  <div>{item.content}</div>
                </div>
              ))}
            </div>
          </section>
        );
      }

      function Reports({ run }) {
        const reports = run?.report_sections || {};
        const labels = {
          market_report: "Market",
          sentiment_report: "Sentiment",
          news_report: "News",
          fundamentals_report: "Fundamentals",
          investment_plan: "Research",
          trader_investment_plan: "Trader",
          final_trade_decision: "Portfolio"
        };
        return (
          <section className="panel">
            <h2>Reports</h2>
            <div className="reports">
              {Object.entries(labels).map(([key, label]) => (
                <div className="report" key={key}>
                  <strong>{label}</strong>
                  <div>{reports[key] || "\nNo content yet."}</div>
                </div>
              ))}
            </div>
          </section>
        );
      }

      function ProgressDashboard({ weekly, history, refresh }) {
        const statuses = weekly?.statuses || {};
        const portfolio = weekly?.portfolio?.performance || {};
        const autopilot = weekly?.autopilot || {};
        const scanner = weekly?.scanner || {};
        const risk = weekly?.risk?.gate || {};
        const costs = weekly?.costs || {};
        const alpha = weekly?.backtests?.benchmark_alpha || {};
        const statusTone = (status) => status === "improving" ? "pos" : status === "degrading" ? "neg" : "muted";
        const pct = (value) => `${((Number(value || 0)) * 100).toFixed(2)}%`;
        return (
          <main className="wide-main">
            <section className="content">
              <section className="panel">
                <div className="toolbar">
                  <div>
                    <h2>Weekly Progress Scorecard</h2>
                    <div className="muted">{weekly?.period?.label || "No weekly progress loaded yet."}</div>
                  </div>
                  <button onClick={refresh}>Refresh</button>
                </div>
                <section className="grid-3">
                  <div className="metric"><span>Overall</span><strong className={statusTone(weekly?.overall_status)}>{weekly?.overall_status || "--"}</strong></div>
                  <div className="metric"><span>Score</span><strong>{weekly?.score ?? 0}/100</strong></div>
                  <div className="metric"><span>Live Trading</span><strong className="neg">{risk.live_trading_allowed ? "allowed" : "disabled"}</strong></div>
                  <div className="metric"><span>Total Return</span><strong className={(portfolio.total_return_pct || 0) >= 0 ? "pos" : "neg"}>{pct(portfolio.total_return_pct)}</strong></div>
                  <div className="metric"><span>Total P&L</span><strong className={(portfolio.total_pnl || 0) >= 0 ? "pos" : "neg"}>{money(portfolio.total_pnl)}</strong></div>
                  <div className="metric"><span>Max Drawdown</span><strong className={(portfolio.max_drawdown || 0) >= -0.1 ? "" : "neg"}>{pct(portfolio.max_drawdown)}</strong></div>
                </section>
              </section>

              <section className="grid-2">
                <section className="panel">
                  <h2>Status Checks</h2>
                  <table>
                    <thead><tr><th>Area</th><th>Status</th><th>Signal</th></tr></thead>
                    <tbody>
                      <tr><td>Profitability</td><td className={statusTone(statuses.profitability)}>{statuses.profitability || "--"}</td><td>SPY alpha {alpha.SPY == null ? "--" : pct(alpha.SPY)}, QQQ alpha {alpha.QQQ == null ? "--" : pct(alpha.QQQ)}</td></tr>
                      <tr><td>Autopilot</td><td className={statusTone(statuses.autopilot)}>{statuses.autopilot || "--"}</td><td>{autopilot.jobs || 0} jobs, {autopilot.errors || 0} errors, {autopilot.paper_orders || 0} paper orders</td></tr>
                      <tr><td>Scanner</td><td className={statusTone(statuses.scanner)}>{statuses.scanner || "--"}</td><td>{scanner.orders || 0} orders, profit factor {scanner.profit_factor == null ? "--" : number(scanner.profit_factor)}</td></tr>
                      <tr><td>Risk</td><td className={statusTone(statuses.risk)}>{statuses.risk || "--"}</td><td>Drawdown {pct(risk.max_drawdown)}, rejection rate {pct(risk.risk_rejection_rate)}</td></tr>
                      <tr><td>Cost</td><td className={statusTone(statuses.cost)}>{statuses.cost || "--"}</td><td>{money(costs.total_usd)} / {money(costs.budget_usd)} weekly budget</td></tr>
                    </tbody>
                  </table>
                </section>

                <section className="panel">
                  <h2>Recommendations</h2>
                  <div className="agent-list">
                    {(weekly?.recommendations || []).length === 0 && <p className="muted">No recommendations loaded.</p>}
                    {(weekly?.recommendations || []).map((item, index) => (
                      <div className="agent" key={index}><span>{item}</span></div>
                    ))}
                  </div>
                </section>
              </section>

              <section className="panel">
                <h2>Weekly History</h2>
                <div className="scroll-table">
                  <table>
                    <thead><tr><th>Week</th><th>Status</th><th>Score</th><th>Return</th><th>P&L</th><th>Drawdown</th><th>Autopilot Jobs</th><th>Orders</th><th>Cost</th></tr></thead>
                    <tbody>
                      {history.length === 0 && <tr><td colSpan="9" className="muted">No weekly history yet.</td></tr>}
                      {history.map((row, index) => (
                        <tr key={`${row.period?.start}-${index}`}>
                          <td>{(row.period?.start || "").slice(0, 10)}</td>
                          <td className={statusTone(row.overall_status)}>{row.overall_status}</td>
                          <td>{row.score}/100</td>
                          <td className={(row.total_return_pct || 0) >= 0 ? "pos" : "neg"}>{pct(row.total_return_pct)}</td>
                          <td className={(row.total_pnl || 0) >= 0 ? "pos" : "neg"}>{money(row.total_pnl)}</td>
                          <td>{pct(row.max_drawdown)}</td>
                          <td>{row.autopilot_jobs || 0}</td>
                          <td>{row.orders || 0}</td>
                          <td>{money(row.openai_cost_usd)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </section>
            </section>
          </main>
        );
      }

      function AutopilotDashboard({ config, status, jobs, loading, error, saveConfig, runNow, refresh, scannerCalibration, readiness }) {
        const [draftSources, setDraftSources] = useState("");
        useEffect(() => {
          if (config) setDraftSources((config.scanner_rss_sources || []).join("\n"));
        }, [config]);
        const nextConfig = config || {};
        function update(values) {
          saveConfig({ ...nextConfig, ...values });
        }
        function saveSources() {
          update({ scanner_rss_sources: draftSources.split("\n").map((item) => item.trim()).filter(Boolean) });
        }
        const latest = status?.latest_job;
        const funnel = scannerCalibration?.funnel || {};
        return (
          <main>
            <aside className="sidebar">
              <section className="panel">
                <h2>Autopilot</h2>
                <div className="checks">
                  <label><input type="checkbox" checked={!!nextConfig.enabled} onChange={(e) => update({ enabled: e.target.checked })} />Enabled</label>
                  <label><input type="checkbox" checked={!!nextConfig.paper_trading_enabled} onChange={(e) => update({ paper_trading_enabled: e.target.checked })} />Paper orders</label>
                  <label><input type="checkbox" checked={!!nextConfig.scanner_enabled} onChange={(e) => update({ scanner_enabled: e.target.checked })} />Scanner</label>
                  <label><input type="checkbox" checked={!!nextConfig.daily_analysis_enabled} onChange={(e) => update({ daily_analysis_enabled: e.target.checked })} />Daily agents</label>
                </div>
                <div className="actions">
                  <button className="primary" disabled={loading || !nextConfig.enabled} onClick={runNow}>{loading ? "Running" : "Run Now"}</button>
                  <button onClick={refresh}>Refresh</button>
                </div>
                {error && <p className="neg">{error}</p>}
              </section>
              <section className="panel">
                <h2>Scanner Sources</h2>
                <div className="field"><label>RSS URLs</label><textarea rows="7" value={draftSources} onChange={(e) => setDraftSources(e.target.value)} /></div>
                <button onClick={saveSources}>Save Sources</button>
              </section>
              <section className="panel">
                <h2>Thresholds</h2>
                <div className="grid-2">
                  <div className="field"><label>Z</label><input type="number" step="0.1" value={nextConfig.z_threshold ?? 1.5} onChange={(e) => update({ z_threshold: Number(e.target.value || 1.5) })} /></div>
                  <div className="field"><label>Confluence</label><input type="number" step="0.01" value={nextConfig.min_confluence_score ?? 0.65} onChange={(e) => update({ min_confluence_score: Number(e.target.value || 0.65) })} /></div>
                </div>
                <div className="grid-2">
                  <div className="field"><label>Min gap</label><input type="number" step="0.001" value={nextConfig.min_abs_gap_pct ?? 0.005} onChange={(e) => update({ min_abs_gap_pct: Number(e.target.value || 0.005) })} /></div>
                  <div className="field"><label>Max orders</label><input type="number" min="0" max="100" value={nextConfig.max_paper_orders_per_cycle ?? 10} onChange={(e) => update({ max_paper_orders_per_cycle: Number(e.target.value || 10) })} /></div>
                </div>
              </section>
            </aside>
            <section className="content">
              <section className="grid-3">
                <div className="metric"><span>Mode</span><strong>{status?.mode || "paper_autopilot"}</strong></div>
                <div className="metric"><span>Status</span><strong className={status?.enabled ? "pos" : "neg"}>{status?.enabled ? "enabled" : "disabled"}</strong></div>
                <div className="metric"><span>Live Trading</span><strong className="neg">{status?.readiness?.live_trading_allowed ? "allowed" : "disabled"}</strong></div>
                <div className="metric"><span>RSS Sources</span><strong>{status?.scanner_sources || 0}</strong></div>
                <div className="metric"><span>Candidates</span><strong>{funnel.paper_candidates || 0}</strong></div>
                <div className="metric"><span>Paper Executions</span><strong>{funnel.paper_executions || 0}</strong></div>
              </section>
              <section className="panel">
                <h2>Latest Autopilot Run</h2>
                <table>
                  <tbody>
                    <tr><th>Status</th><td>{latest?.status || "--"}</td></tr>
                    <tr><th>Started</th><td>{latest?.started_at || "--"}</td></tr>
                    <tr><th>Ended</th><td>{latest?.ended_at || "--"}</td></tr>
                    <tr><th>Events</th><td>{latest?.result?.summary?.scanner_events || 0}</td></tr>
                    <tr><th>Signals</th><td>{latest?.result?.summary?.scanner_signals || 0}</td></tr>
                    <tr><th>Orders</th><td>{latest?.result?.summary?.paper_executions || 0}</td></tr>
                    <tr><th>Error</th><td className="neg">{latest?.error || "--"}</td></tr>
                  </tbody>
                </table>
              </section>
              <section className="panel">
                <h2>Autopilot Jobs</h2>
                <div className="scroll-table">
                  <table>
                    <thead><tr><th>Started</th><th>Type</th><th>Status</th><th>Signals</th><th>Orders</th><th>Error</th></tr></thead>
                    <tbody>
                      {jobs.length === 0 && <tr><td colSpan="6" className="muted">No autopilot jobs yet.</td></tr>}
                      {jobs.map((job) => (
                        <tr key={job.job_id}>
                          <td>{job.started_at}</td>
                          <td>{job.job_type}</td>
                          <td className={job.status === "completed" ? "pos" : job.status === "error" ? "neg" : ""}>{job.status}</td>
                          <td>{job.result?.summary?.scanner_signals || 0}</td>
                          <td>{job.result?.summary?.paper_executions || 0}</td>
                          <td className="neg">{job.error || "--"}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </section>
            </section>
          </main>
        );
      }

      function Portfolio({ portfolio }) {
        const positions = Object.entries(portfolio?.positions || {});
        return (
          <section className="panel">
            <h2>Paper Portfolio</h2>
            <div className="grid-2">
              <div className="metric"><span>Cash</span><strong>{money(portfolio?.cash)}</strong></div>
              <div className="metric"><span>Equity</span><strong>{money(portfolio?.equity)}</strong></div>
            </div>
            <table>
              <thead>
                <tr><th>Ticker</th><th>Qty</th><th>Value</th><th>Unrealized</th></tr>
              </thead>
              <tbody>
                {positions.length === 0 && <tr><td colSpan="4" className="muted">No positions.</td></tr>}
                {positions.map(([ticker, pos]) => (
                  <tr key={ticker}>
                    <td>{ticker}</td>
                    <td>{number(pos.quantity)}</td>
                    <td>{money(pos.market_value)}</td>
                    <td className={(pos.unrealized_pnl || 0) >= 0 ? "pos" : "neg"}>{money(pos.unrealized_pnl)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </section>
        );
      }

      function PortfolioDashboard({ portfolio, data }) {
        const history = data?.history || [];
        const trades = data?.trades || [];
        const performance = data?.performance || {};
        const benchmarks = performance.benchmarks || [];
        const equities = history.map((item) => Number(item.equity || 0));
        const min = Math.min(...equities, Number(portfolio?.equity || 0));
        const max = Math.max(...equities, Number(portfolio?.equity || 0));
        return (
          <main className="wide-main">
            <section className="content">
              <div className="grid-3">
                <div className="metric"><span>Equity</span><strong>{money(portfolio?.equity)}</strong></div>
                <div className="metric"><span>Market Value</span><strong>{money(portfolio?.market_value)}</strong></div>
                <div className="metric"><span>Max Drawdown</span><strong className="neg">{((performance.max_drawdown || 0) * 100).toFixed(2)}%</strong></div>
              </div>
              <div className="grid-3">
                <div className="metric"><span>Total Return</span><strong className={(performance.total_pnl || 0) >= 0 ? "pos" : "neg"}>{((performance.total_return_pct || 0) * 100).toFixed(2)}%</strong></div>
                <div className="metric"><span>Win Rate</span><strong>{((performance.win_rate || 0) * 100).toFixed(1)}%</strong></div>
                <div className="metric"><span>Profit Factor</span><strong>{performance.profit_factor == null ? "--" : number(performance.profit_factor)}</strong></div>
              </div>
              <div className="grid-3">
                <div className="metric"><span>Closed Trades</span><strong>{performance.closed_trade_count || 0}</strong></div>
                <div className="metric"><span>Avg Closed P&L</span><strong className={(performance.average_closed_trade_pnl || 0) >= 0 ? "pos" : "neg"}>{money(performance.average_closed_trade_pnl)}</strong></div>
                <div className="metric"><span>Sharpe-like</span><strong>{number(performance.sharpe_like || 0)}</strong></div>
              </div>
              <section className="panel">
                <h2>Equity Curve</h2>
                <div className="chart">
                  {history.length === 0 && <p className="muted">No portfolio snapshots yet.</p>}
                  {history.map((item) => {
                    const height = max === min ? 50 : 15 + ((Number(item.equity) - min) / (max - min)) * 150;
                    return <div className="bar" title={`${item.created_at}: ${money(item.equity)}`} style={{ height: `${height}px` }} key={item.id}></div>;
                  })}
                </div>
              </section>
              <section className="panel">
                <h2>Benchmark Comparison</h2>
                <table>
                  <thead><tr><th>Benchmark</th><th>Return</th><th>Alpha</th><th>Alpha Value</th><th>Period</th></tr></thead>
                  <tbody>
                    {benchmarks.length === 0 && <tr><td colSpan="5" className="muted">Benchmark data is not available yet.</td></tr>}
                    {benchmarks.map((item) => (
                      <tr key={item.ticker}>
                        <td>{item.ticker}</td>
                        {item.error ? (
                          <td colSpan="4" className="muted">{item.error}</td>
                        ) : (
                          <>
                            <td className={(item.return_pct || 0) >= 0 ? "pos" : "neg"}>{((item.return_pct || 0) * 100).toFixed(2)}%</td>
                            <td className={(item.alpha_pct || 0) >= 0 ? "pos" : "neg"}>{((item.alpha_pct || 0) * 100).toFixed(2)}%</td>
                            <td className={(item.alpha_value || 0) >= 0 ? "pos" : "neg"}>{money(item.alpha_value)}</td>
                            <td>{item.start_date} → {item.end_date}</td>
                          </>
                        )}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </section>
              <div className="grid-2">
                <Portfolio portfolio={portfolio} />
                <section className="panel">
                  <h2>Trade Ledger</h2>
                  <div className="scroll-table">
                    <table>
                      <thead><tr><th>Date</th><th>Ticker</th><th>Decision</th><th>Action</th><th>Qty</th><th>Price</th></tr></thead>
                      <tbody>
                        {trades.length === 0 && <tr><td colSpan="6" className="muted">No trades recorded.</td></tr>}
                        {trades.map((trade, index) => (
                          <tr key={`${trade.run_id}-${index}`}>
                            <td>{trade.trade_date}</td><td>{trade.ticker}</td><td>{trade.decision}</td><td>{trade.action}</td><td>{number(trade.quantity)}</td><td>{money(trade.price)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </section>
              </div>
            </section>
          </main>
        );
      }

      function BacktestsDashboard({ form, setForm, backtests, selected, loading, error, runBacktest, openBacktest }) {
        const result = selected?.result || {};
        const summary = result.summary || selected?.summary || {};
        const performance = result.performance || {};
        const validation = result.validation || {};
        const walkForward = validation.walk_forward || {};
        const monteCarlo = validation.monte_carlo || {};
        const trades = result.trades || [];
        const history = result.history || [];
        const benchmarks = performance.benchmarks || [];
        const equities = history.map((item) => Number(item.equity || 0));
        const min = equities.length ? Math.min(...equities) : 0;
        const max = equities.length ? Math.max(...equities) : 0;
        return (
          <main>
            <aside className="sidebar">
              <section className="panel">
                <h2>New Backtest</h2>

              </section>
            </aside>
            <section className="content">
              <section className="grid-3">

                <div className="metric"><span>Total Return</span><strong className={(summary.total_return_pct || 0) >= 0 ? "pos" : "neg"}>{((summary.total_return_pct || 0) * 100).toFixed(2)}%</strong></div>
              </section>
              <section className="grid-3">
                <div className="metric"><span>Trades</span><strong>{summary.trade_count || 0}</strong></div>
                <div className="metric"><span>Max Drawdown</span><strong className="neg">{((summary.max_drawdown || 0) * 100).toFixed(2)}%</strong></div>
                <div className="metric"><span>Skipped</span><strong>{summary.skipped_count || 0}</strong></div>
              </section>
              <section className="grid-3">
                <div className="metric"><span>Walk-Forward Pass</span><strong>{((walkForward.pass_rate || 0) * 100).toFixed(1)}%</strong></div>
                <div className="metric"><span>MC 5th Percentile</span><strong className={(monteCarlo.return_pct_p05 || 0) >= 0 ? "pos" : "neg"}>{((monteCarlo.return_pct_p05 || 0) * 100).toFixed(2)}%</strong></div>
                <div className="metric"><span>MC Loss Probability</span><strong className={(monteCarlo.loss_probability || 0) <= 0.25 ? "pos" : "neg"}>{((monteCarlo.loss_probability || 0) * 100).toFixed(1)}%</strong></div>

                <div className="chart">

                    return <div className="bar" title={`${item.created_at}: ${money(item.equity)}`} style={{ height: `${height}px` }} key={`${item.created_at}-${index}`}></div>;

                    <thead><tr><th>Ticker</th><th>Return</th><th>Alpha</th></tr></thead>
                    <tbody>
                      {benchmarks.length === 0 && <tr><td colSpan="3" className="muted">No benchmark rows.</td></tr>}
                      {benchmarks.map((item) => (
                        <tr key={item.ticker}><td>{item.ticker}</td><td className={(item.return_pct || 0) >= 0 ? "pos" : "neg"}>{((item.return_pct || 0) * 100).toFixed(2)}%</td><td className={(item.alpha_pct || 0) >= 0 ? "pos" : "neg"}>{((item.alpha_pct || 0) * 100).toFixed(2)}%</td></tr>

                <section className="panel">
                  <h2>Backtest Trades</h2>

                      <thead><tr><th>Date</th><th>Ticker</th><th>Action</th><th>Qty</th><th>Price</th></tr></thead>
                      <tbody>
                        {trades.length === 0 && <tr><td colSpan="5" className="muted">No trades.</td></tr>}
                        {trades.slice(-100).reverse().map((trade, index) => (
                          <tr key={`${trade.trade_date}-${trade.ticker}-${index}`}><td>{trade.trade_date}</td><td>{trade.ticker}</td><td>{trade.action}</td><td>{number(trade.quantity)}</td><td>{money(trade.price)}</td></tr>

                      </tbody>
                    </table>
                  </div>
                </section>
              </div>
            </section>

                    <div className="field"><label>End</label><input type="date" value={form.end} onChange={(e) => setForm({ ...form, end: e.target.value })} /></div>

                    <div className="field"><label>Fixed decision</label><select value={form.fixed_decision} onChange={(e) => setForm({ ...form, fixed_decision: e.target.value })}>{["Hold", "Buy", "Overweight", "Underweight", "Sell"].map((item) => <option key={item}>{item}</option>)}</select></div>

                  <div className="field"><label>Quick model</label><input value={form.shallow_thinker} onChange={(e) => setForm({ ...form, shallow_thinker: e.target.value })} /></div>
                  <div className="field"><label>Deep model</label><input value={form.deep_thinker} onChange={(e) => setForm({ ...form, deep_thinker: e.target.value })} /></div>

              <section className="panel">
                <h2>Replay Jobs</h2>

                    </button>
                  ))}

              </section>
            </aside>
            <section className="content">
              <section className="grid-3">
                <div className="metric"><span>Status</span><strong>{selected?.status || "--"}</strong></div>
                <div className="metric"><span>Progress</span><strong>{((progress.pct_complete || 0) * 100).toFixed(1)}%</strong></div>
                <div className="metric"><span>Decisions</span><strong>{progress.completed_steps || 0} / {progress.total_steps || 0}</strong></div>
              </section>
              <section className="grid-3">
                <div className="metric"><span>Total P&L</span><strong className={(summary.total_pnl || 0) >= 0 ? "pos" : "neg"}>{money(summary.total_pnl)}</strong></div>
                <div className="metric"><span>Total Return</span><strong className={(summary.total_return_pct || 0) >= 0 ? "pos" : "neg"}>{((summary.total_return_pct || 0) * 100).toFixed(2)}%</strong></div>

      function ScannerDashboard({ form, setForm, signals, events, dislocations, confluenceReviews, calibration, loading, error, ingestEvent, detectDislocations, reviewConfluence, executeConfluence, refresh }) {
        const paperCandidates = confluenceReviews.filter((item) => item.status === "paper_candidate");
        const executableCandidates = paperCandidates.filter((item) => !item.execution);
        const funnel = calibration?.funnel || {};
        const scannerStrategy = calibration?.scanner || {};
        const baselineStrategy = calibration?.baseline || {};
        return (
          <main>
            <aside className="sidebar">
              <section className="panel">
                <h2>Manual Event</h2>
                <form onSubmit={ingestEvent}>
                  <div className="field"><label>Title</label><input value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} /></div>
                  <div className="field"><label>Summary</label><input value={form.summary} onChange={(e) => setForm({ ...form, summary: e.target.value })} /></div>
                  <div className="grid-2">
                    <div className="field"><label>Region</label><select value={form.region} onChange={(e) => setForm({ ...form, region: e.target.value })}>{["GLOBAL", "ASIA", "EU", "ME", "US"].map((item) => <option key={item}>{item}</option>)}</select></div>
                    <div className="field"><label>Source</label><input value={form.source} onChange={(e) => setForm({ ...form, source: e.target.value })} /></div>
                  </div>
                  <div className="field"><label>URL</label><input value={form.url} onChange={(e) => setForm({ ...form, url: e.target.value })} /></div>
                  <div className="actions">
                    <button className="primary" type="submit" disabled={loading}>{loading ? "Scanning" : "Scan Event"}</button>
                    <button type="button" onClick={refresh}>Refresh</button>
                  </div>
                  {error && <p className="neg">{error}</p>}
                </form>
              </section>
              <section className="panel">
                <h2>Dislocation Detector</h2>
                <div className="grid-2">
                  <div className="field"><label>Lookback days</label><input type="number" min="10" max="500" value={form.lookback_days} onChange={(e) => setForm({ ...form, lookback_days: e.target.value })} /></div>
                  <div className="field"><label>Z threshold</label><input type="number" min="0" max="10" step="0.1" value={form.z_threshold} onChange={(e) => setForm({ ...form, z_threshold: e.target.value })} /></div>
                </div>
                <div className="grid-2">
                  <div className="field"><label>Min gap pct</label><input type="number" min="0" max="1" step="0.001" value={form.min_abs_gap_pct} onChange={(e) => setForm({ ...form, min_abs_gap_pct: e.target.value })} /></div>
                  <div className="field"><label>Min confluence</label><input type="number" min="0" max="1" step="0.01" value={form.min_total_score} onChange={(e) => setForm({ ...form, min_total_score: e.target.value })} /></div>
                </div>
                <div className="actions">
                  <button className="primary" type="button" disabled={loading || signals.length === 0} onClick={detectDislocations}>{loading ? "Detecting" : "Detect Dislocations"}</button>
                  <button type="button" disabled={loading || dislocations.length === 0} onClick={reviewConfluence}>Review Confluence</button>
                  <button type="button" disabled={loading || executableCandidates.length === 0} onClick={executeConfluence}>Paper Execute</button>
                </div>
              </section>
              <section className="panel">
                <h2>Recent Events</h2>
                <div className="agent-list">
                  {events.length === 0 && <p className="muted">No scanner events yet.</p>}
                  {events.slice(0, 8).map((event) => (
                    <div className="agent" key={event.event_id}>
                      <span>{event.title}</span>
                      <span className="muted">{event.region}</span>
                    </div>
                  ))}
                </div>
              </section>
            </aside>
            <section className="content">
              <section className="grid-3">
                <div className="metric"><span>Signals</span><strong>{signals.length}</strong></div>
                <div className="metric"><span>Events</span><strong>{events.length}</strong></div>
                <div className="metric"><span>Dislocations</span><strong>{dislocations.filter((item) => item.is_dislocated).length}</strong></div>
                <div className="metric"><span>Paper Candidates</span><strong>{paperCandidates.length}</strong></div>
                <div className="metric"><span>Paper Executions</span><strong>{confluenceReviews.filter((item) => item.execution_status).length}</strong></div>
                <div className="metric"><span>Rejected</span><strong>{confluenceReviews.filter((item) => item.status === "rejected" || item.execution_status === "rejected").length}</strong></div>
              </section>
              <section className="panel">
                <h2>Paper Candidates</h2>
                <div className="scroll-table">
                  <table>
                    <thead><tr><th>Score</th><th>Action</th><th>Target</th><th>Entity</th><th>Status</th><th>Execution</th><th>Reason</th></tr></thead>
                    <tbody>
                      {confluenceReviews.length === 0 && <tr><td colSpan="7" className="muted">No confluence reviews yet.</td></tr>}
                      {confluenceReviews.map((item) => (
                        <tr key={item.review_id}>
                          <td className={item.status === "paper_candidate" ? "pos" : ""}>{number(item.total_score)}</td>
                          <td className={item.action === "Sell" ? "neg" : item.action === "Buy" ? "pos" : ""}>{item.action}</td>
                          <td>{item.target_symbol}</td>
                          <td>{item.entity}</td>
                          <td>{item.status}</td>
                          <td>{item.execution_status || item.execution?.status || "--"}</td>
                          <td>{item.candidate?.reason || item.agent_reviews?.map((agent) => agent.reason).join(", ") || "--"}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </section>
              <section className="panel">
                <h2>Scanner Calibration</h2>
                <section className="grid-3">
                  <div className="metric"><span>Candidate Rate</span><strong>{((funnel.candidate_per_dislocation || 0) * 100).toFixed(1)}%</strong></div>
                  <div className="metric"><span>Execution Rate</span><strong>{((funnel.execution_per_candidate || 0) * 100).toFixed(1)}%</strong></div>
                  <div className="metric"><span>Scanner Fill Rate</span><strong>{((scannerStrategy.fill_rate || 0) * 100).toFixed(1)}%</strong></div>
                  <div className="metric"><span>Scanner Notional</span><strong>{money(scannerStrategy.filled_notional || 0)}</strong></div>
                  <div className="metric"><span>Scanner Trades</span><strong>{scannerStrategy.performance?.trade_count || 0}</strong></div>
                  <div className="metric"><span>Agent Orders</span><strong>{baselineStrategy.orders || 0}</strong></div>
                </section>
                <div className="scroll-table">
                  <table>
                    <thead><tr><th>Strategy</th><th>Orders</th><th>Filled</th><th>Rejected</th><th>Fill Rate</th><th>Closed P&L</th><th>Profit Factor</th></tr></thead>
                    <tbody>
                      {[scannerStrategy, baselineStrategy].map((strategy) => (
                        <tr key={strategy.name || "unknown"}>
                          <td>{strategy.name || "--"}</td>
                          <td>{strategy.orders || 0}</td>
                          <td>{strategy.filled_orders || 0}</td>
                          <td>{strategy.rejected_orders || 0}</td>
                          <td>{((strategy.fill_rate || 0) * 100).toFixed(1)}%</td>
                          <td className={(strategy.performance?.gross_profit || 0) - (strategy.performance?.gross_loss || 0) >= 0 ? "pos" : "neg"}>{money((strategy.performance?.gross_profit || 0) - (strategy.performance?.gross_loss || 0))}</td>
                          <td>{strategy.performance?.profit_factor == null ? "--" : number(strategy.performance.profit_factor)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div className="agent-list">
                  {(calibration?.recommendations || []).map((item, index) => (
                    <div className="agent" key={index}><span>{item}</span></div>
                  ))}
                </div>
              </section>
              <section className="panel">
                <h2>Detected Dislocations</h2>
                <div className="scroll-table">
                  <table>
                    <thead><tr><th>Z</th><th>Gap</th><th>Reference</th><th>Target</th><th>Entity</th><th>State</th></tr></thead>
                    <tbody>
                      {dislocations.length === 0 && <tr><td colSpan="6" className="muted">No dislocations detected yet.</td></tr>}
                      {dislocations.map((item) => (
                        <tr key={item.dislocation_id}>
                          <td className={item.is_dislocated ? "pos" : ""}>{number(item.z_score)}</td>
                          <td className={(item.gap_pct || 0) >= 0 ? "pos" : "neg"}>{((item.gap_pct || 0) * 100).toFixed(2)}%</td>
                          <td>{item.reference_symbol}</td>
                          <td>{item.target_symbol}</td>
                          <td>{item.entity}</td>
                          <td>{item.is_dislocated ? item.direction : "normal"}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </section>
              <section className="panel">
                <h2>Cross-Market Signals</h2>
                <div className="scroll-table">
                  <table>
                    <thead><tr><th>Score</th><th>Entity</th><th>Direction</th><th>US Targets</th><th>Reason</th><th>Region</th></tr></thead>
                    <tbody>
                      {signals.length === 0 && <tr><td colSpan="6" className="muted">No scanner signals yet.</td></tr>}
                      {signals.map((signal) => (
                        <tr key={signal.signal_id}>
                          <td>{number(signal.score)}</td>
                          <td>{signal.entity}</td>
                          <td className={signal.direction === "bearish" ? "neg" : signal.direction === "bullish" ? "pos" : ""}>{signal.direction}</td>
                          <td>{(signal.us_targets || []).join(", ")}</td>
                          <td>{signal.reason}</td>
                          <td>{signal.region}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </section>
            </section>
          </main>
        );
      }

      function AutomationDashboard({ config, history, refresh }) {
        const [draft, setDraft] = useState("");
        useEffect(() => { if (config) setDraft((config.watchlist || []).join(", ")); }, [config]);

        async function save() {
          const next = { ...(config || {}), watchlist: draft.split(",").map((item) => item.trim()).filter(Boolean) };
          await fetch("/api/automation/config", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(next) });
          refresh();
        }

        async function runNow() {
          await fetch("/api/automation/run-now", { method: "POST" });
          refresh();
        }

        return (
          <main className="wide-main">
            <section className="content">
              <section className="panel">
                <div className="toolbar">
                  <h2>Daily Automation</h2>
                  <div className="actions"><button onClick={save}>Save</button><button className="primary" onClick={runNow}>Run Now</button></div>
                </div>
                <div className="grid-3">
                  <div className="metric"><span>Schedule</span><strong>Mon-Fri 09:00</strong></div>
                  <div className="metric"><span>Budget</span><strong>{money(config?.daily_openai_budget_usd || 5)}</strong></div>
                  <div className="metric"><span>Positions included</span><strong>{config?.include_positions ? "Yes" : "No"}</strong></div>
                </div>
                <div className="field"><label>Watchlist</label><input value={draft} onChange={(e) => setDraft(e.target.value)} /></div>
              </section>
              <section className="panel">
                <h2>Automation History</h2>
                <table>
                  <thead><tr><th>Date</th><th>Status</th><th>Tickers</th><th>Started</th></tr></thead>
                  <tbody>
                    {history.length === 0 && <tr><td colSpan="4" className="muted">No daily jobs yet.</td></tr>}
                    {history.map((job) => <tr key={job.id}><td>{job.job_date}</td><td>{job.status}</td><td>{(job.tickers || []).join(", ")}</td><td>{job.started_at}</td></tr>)}
                  </tbody>
                </table>
              </section>
            </section>
          </main>
        );
      }
