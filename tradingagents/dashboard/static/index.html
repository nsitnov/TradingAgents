        const summary = postmortems?.summary || {};
        return (
          <main className="wide-main">
            <section className="content">
              <section className="panel">
                <div className="toolbar">
                  <h2>Production Readiness</h2>
                  <button onClick={refresh}>Refresh</button>
                </div>
                <section className="grid-3">
                  <div className="metric"><span>Status</span><strong className={gate?.status === "ready_for_review" ? "pos" : "neg"}>{gate?.status || "unknown"}</strong></div>
                  <div className="metric"><span>Live Trading</span><strong className="neg">{gate?.live_trading_allowed ? "Allowed" : "Disabled"}</strong></div>
                  <div className="metric"><span>Paper Days</span><strong>{gate?.paper_days || 0}</strong></div>
                  <div className="metric"><span>Orders</span><strong>{metrics?.orders_total || 0}</strong></div>
                  <div className="metric"><span>Scanner Executions</span><strong>{metrics?.scanner_paper_executions_total || 0}</strong></div>
                  <div className="metric"><span>Max Drawdown</span><strong className="neg">{((gate?.max_drawdown || 0) * 100).toFixed(1)}%</strong></div>
                </section>
              </section>
              <section className="panel">
                <h2>Stability Gate</h2>
                <table>
                  <thead><tr><th>Check</th><th>Status</th><th>Detail</th></tr></thead>
                  <tbody>
                    {items.length === 0 && <tr><td colSpan="3" className="muted">No readiness checks loaded.</td></tr>}
                    {items.map((item) => (
                      <tr key={item.name}>
                        <td>{item.name}</td>
                        <td className={item.passed ? "pos" : "neg"}>{item.passed ? "pass" : "block"}</td>
                        <td>{item.detail}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </section>
              <section className="panel">
                <h2>Trade Postmortems</h2>
                <section className="grid-3">
                  <div className="metric"><span>Closed</span><strong>{summary.closed_trades || 0}</strong></div>
                  <div className="metric"><span>Wins</span><strong className="pos">{summary.wins || 0}</strong></div>
                  <div className="metric"><span>Total P&L</span><strong className={(summary.total_pnl || 0) >= 0 ? "pos" : "neg"}>{money(summary.total_pnl || 0)}</strong></div>
                </section>
                <div className="scroll-table">
                  <table>
                    <thead><tr><th>Exit</th><th>Ticker</th><th>Source</th><th>Result</th><th>P&L</th><th>Return</th><th>Notes</th></tr></thead>
                    <tbody>
                      {closed.length === 0 && <tr><td colSpan="7" className="muted">No closed trades yet.</td></tr>}
                      {closed.map((item, index) => (
                        <tr key={`${item.ticker}-${item.exit_date}-${index}`}>
                          <td>{item.exit_date}</td>
                          <td>{item.ticker}</td>
                          <td>{item.source}</td>
                          <td className={item.verdict === "win" ? "pos" : item.verdict === "loss" ? "neg" : ""}>{item.verdict}</td>
                          <td className={(item.pnl || 0) >= 0 ? "pos" : "neg"}>{money(item.pnl)}</td>
                          <td>{((item.return_pct || 0) * 100).toFixed(2)}%</td>
                          <td>{(item.notes || []).join(" ")}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </section>
            </section>
          </main>
        );
      }

      function AnalysisHistory({ runs }) {
        return (
          <main className="wide-main">
            <section className="panel">
              <h2>Analysis History</h2>
              <div className="scroll-table">
                <table>
                  <thead><tr><th>Started</th><th>Ticker</th><th>Date</th><th>Status</th><th>Decision</th><th>Source</th><th>LLM</th><th>Tokens</th></tr></thead>
                  <tbody>
                    {runs.length === 0 && <tr><td colSpan="8" className="muted">No analysis history yet.</td></tr>}
                    {runs.map((item) => (
                      <tr key={item.run_id}>
                        <td>{item.started_at}</td><td>{item.request.ticker}</td><td>{item.request.analysis_date}</td><td>{item.status}</td><td>{item.decision || "--"}</td><td>{item.source || "manual"}</td><td>{item.stats?.llm_calls || 0}</td><td>{(item.stats?.tokens_in || 0) + (item.stats?.tokens_out || 0)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </section>
          </main>
        );
      }

      function CostsDashboard({ data, refresh }) {
        const costs = data?.costs || [];
        return (
          <main className="wide-main">
            <section className="content">
              <section className="grid-3">
                <div className="metric"><span>OpenAI Cost Source</span><strong>{data?.configured ? "Costs API" : "Not configured"}</strong></div>
                <div className="metric"><span>Total Loaded</span><strong>{money(data?.total)}</strong></div>
                <div className="metric"><span>Rows</span><strong>{costs.length}</strong></div>
              </section>
              {data?.error && <section className="panel"><p className="neg">{data.error}</p></section>}
              {!data?.configured && <section className="panel"><p className="muted">Set OPENAI_ADMIN_KEY in the dashboard env file to load official invoice-aligned costs.</p></section>}
              <section className="panel">
                <div className="toolbar"><h2>OpenAI Spend</h2><button onClick={refresh}>Refresh</button></div>
                <table>
                  <thead><tr><th>Start</th><th>End</th><th>Amount</th><th>Currency</th><th>Line Item</th><th>Project</th></tr></thead>
                  <tbody>
                    {costs.length === 0 && <tr><td colSpan="6" className="muted">No cost data loaded.</td></tr>}
                    {costs.map((cost, index) => (
                      <tr key={index}><td>{new Date(cost.start_time * 1000).toISOString().slice(0, 10)}</td><td>{new Date(cost.end_time * 1000).toISOString().slice(0, 10)}</td><td>{money(cost.amount)}</td><td>{cost.currency}</td><td>{cost.line_item || "--"}</td><td>{cost.project_id || "--"}</td></tr>
                    ))}
                  </tbody>
                </table>
              </section>
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
